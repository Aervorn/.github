name: Reusable auto-assign

on:
  workflow_call:
    inputs:
      assignees:
        description: Comma-separated GitHub usernames to assign to the issue or pull request.
        required: true
        type: string

permissions:
  issues: write
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Assign issue or pull request
        uses: actions/github-script@v7
        env:
          ASSIGNEES: ${{ inputs.assignees }}
        with:
          script: |
            const assignees = process.env.ASSIGNEES
              .split(',')
              .map((username) => username.trim())
              .filter(Boolean);

            if (assignees.length === 0) {
              core.setFailed('The assignees input must contain at least one GitHub username.');
              return;
            }

            const issue_number = context.payload.issue?.number
              ?? context.payload.pull_request?.number;

            if (!issue_number) {
              core.setFailed('This workflow must be called by an issue or pull request event.');
              return;
            }

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              assignees,
            });
